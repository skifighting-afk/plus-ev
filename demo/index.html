<script type="module">import '/demo/mock-sb.js'; const j = await (await fetch('/demo/db-home.json')).json(); // 데모 날짜를 오늘 기준으로 옮김 (마지막 마감 = 어제)
const last = j.db.daily_reports.map(r => r.report_date).sort().pop(), y = new Date(Date.now() + 9 * 3600e3 - 864e5).toISOString().slice(0, 10), off = Math.round((new Date(y) - new Date(last)) / 864e5) * 864e5;
const mv = v => /^\d{4}-\d{2}-\d{2}$/.test(v) ? new Date(+new Date(v) + off).toISOString().slice(0, 10) : /^\d{4}-\d{2}-\d{2}T/.test(v) ? new Date(+new Date(v) + off).toISOString() : /^\d{4}-\d{2}$/.test(v) ? new Date(+new Date(v + '-15') + off).toISOString().slice(0, 7) : v;
for (const rows of Object.values(j.db)) if (Array.isArray(rows)) for (const r of rows) for (const k in r) if (typeof r[k] === 'string') r[k] = mv(r[k]);
Object.assign(window.__DB, j.db); Object.assign(window.__USERS, j.users); window.__DEMO = 1;
const as = new URLSearchParams(location.search).get('as'); window.__AUTO = { owner: 'owner@t.dev', staff: 'ace@t.dev' }[as] || null; await import('/app.js');</script>
