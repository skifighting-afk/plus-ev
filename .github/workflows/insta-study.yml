name: 홀덤 스터디 릴스 (+EV 심화 20편)

# lessons.mjs 대본으로 30초~1분 공부 영상을 만든다 (Higgsfield 비용 없음, 나레이션 MeloTTS).
# publish=true 이면 insta-media 브랜치에 올리고 Supabase insta-reels sync → s01~s20 ready (22:00 자동 게시).
on:
  workflow_dispatch:
    inputs:
      lessons:
        description: '편 (예: s01 또는 s01,s02). 비우면 20편 전부'
        required: false
        default: ''
      publish:
        description: '게시 큐에 올리기 (ready)'
        type: boolean
        default: false

concurrency:
  group: insta-media
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 이 묶음이 만들 편
        id: pick
        run: |
          want="${{ github.event.inputs.lessons }}"
          all=$(node -e "import('./tools/insta-study/lessons.mjs').then(m=>console.log(m.LESSONS.map(l=>l.id).join(',')))")
          [ -z "$want" ] && want=$all
          mine=$(echo "$want" | tr ',' '\n' | awk -v s=${{ matrix.shard }} 'NR%4==s' | paste -sd, -)
          echo "ids=$mine" >> "$GITHUB_OUTPUT"; echo "묶음 ${{ matrix.shard }}: $mine"
      - name: 도구 준비
        if: steps.pick.outputs.ids != ''
        run: |
          export DEBIAN_FRONTEND=noninteractive
          for n in 1 2 3; do timeout 300 sudo -E apt-get update -qq >/dev/null && timeout 400 sudo -E apt-get install -y -qq --no-install-recommends fonts-noto-cjk ffmpeg >/dev/null && break; sleep 10; done
          npm install --no-save --no-audit --no-fund playwright@1.56.0 >/dev/null
          timeout 600 npx playwright install --with-deps chromium >/dev/null
      - uses: actions/setup-python@v5
        if: steps.pick.outputs.ids != ''
        with:
          python-version: '3.10'
      - name: 목소리 모델 캐시
        if: steps.pick.outputs.ids != ''
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: melotts-v1
      - name: 목소리 모델 준비 (MeloTTS)
        if: steps.pick.outputs.ids != ''
        continue-on-error: true
        timeout-minutes: 20
        run: |
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q git+https://github.com/myshell-ai/MeloTTS.git
          python -m unidic download >/dev/null
          python -c "import nltk;[nltk.download(x,quiet=True) for x in ['averaged_perceptron_tagger','averaged_perceptron_tagger_eng','cmudict']]"
          python -c "from melo.api import TTS" && echo "REEL_PYTHON=$(which python)" >> "$GITHUB_ENV"
      - name: 렌더
        if: steps.pick.outputs.ids != ''
        run: node tools/insta-study/make-study.mjs study-out "${{ steps.pick.outputs.ids }}"
      - uses: actions/upload-artifact@v4
        if: steps.pick.outputs.ids != ''
        with:
          name: study-${{ matrix.shard }}
          path: study-out/
          retention-days: 14

  publish:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: arts
      - name: 모아서 미리보기 브랜치(study-out)에 올리기
        run: |
          mkdir pub && cp arts/*/*.mp4 arts/*/report-*.json pub/ 2>/dev/null || true
          ls -la pub
          cd pub && git init -q && git checkout -q -b study-out
          git -c user.name=study-bot -c user.email=study-bot@users.noreply.github.com add -A
          git -c user.name=study-bot -c user.email=study-bot@users.noreply.github.com commit -qm "study $(date -u +%F' '%H:%M)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" study-out
      - uses: actions/setup-node@v4
        if: github.event.inputs.publish == 'true'
        with:
          node-version: 22
      - name: insta-media 브랜치 + 매니페스트에 등록
        if: github.event.inputs.publish == 'true'
        run: |
          git fetch --depth 1 origin insta-media && git worktree add media origin/insta-media || { mkdir -p media; echo '{}' > media/manifest.json; }
          node tools/insta-study/register.mjs pub media
          mkdir out2 && cp media/manifest.json out2/ && (cp media/*.mp4 out2/ 2>/dev/null || true)
          cd out2 && git init -q && git checkout -q -b insta-media
          git -c user.name=reel-bot -c user.email=reel-bot@users.noreply.github.com add -A
          git -c user.name=reel-bot -c user.email=reel-bot@users.noreply.github.com commit -qm "study media $(date -u +%F' '%H:%M)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" insta-media
          sleep 20
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{"action":"sync"}' https://hkcmsjwuwopxritafreg.supabase.co/functions/v1/insta-reels; echo
