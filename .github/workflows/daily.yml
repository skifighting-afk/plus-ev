# 매일 자동 점검: 계산 엔진 테스트 + 사장앱·손님앱 페이지 응답 확인
name: daily-check
on:
  schedule: [{ cron: '0 0 * * *' }]  # 매일 09:00 KST
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node engine.test.mjs
      - run: node --check app.js && node --check table/common.js
      - name: pages up
        run: for u in / /table/app /table/owner /table/about; do curl -fsS -o /dev/null -w "%{http_code} $u\n" "https://plusevapp.kr$u"; done
