name: Android 앱 빌드 (TWA)

on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/android.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_PASS: ${{ secrets.KEYSTORE_PASS }}
    steps:
      - run: test -n "$KS_PASS" || { echo '::error::KEYSTORE_PASS secret이 없어요. 저장소 Settings → Secrets → Actions 에 추가하세요.'; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm i -g @bubblewrap/cli

      - name: bubblewrap 설정 (JDK·SDK 경로)
        run: |
          mkdir -p ~/.bubblewrap
          sudo mkdir -p $ANDROID_HOME/tools/bin && sudo ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/tools/bin/sdkmanager
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          yes | sdkmanager --licenses >/dev/null || true

      - name: 서명 키 (암호화된 키가 저장소에 있으면 복호화, 없으면 새로 생성 후 암호화)
        working-directory: android
        run: |
          if [ -f android.keystore.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass pass:"$KS_PASS" -in android.keystore.enc -out android.keystore
          else
            keytool -genkeypair -v -keystore android.keystore -alias plusev -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=PlusEV, OU=plusevapp, O=plusevapp.kr, L=Seoul, C=KR"
            openssl enc -aes-256-cbc -pbkdf2 -pass pass:"$KS_PASS" -in android.keystore -out android.keystore.enc
          fi
          keytool -list -v -keystore android.keystore -alias plusev -storepass "$KS_PASS" | grep SHA256 > fingerprint.txt
          cat fingerprint.txt

      - name: 안드로이드 프로젝트 생성 + 빌드
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.KS_PASS }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.KS_PASS }}
        run: |
          bubblewrap update --skipVersionUpgrade
          # 구글 대체결제(한국) 네이티브 화면 추가 — bubblewrap update가 프로젝트를 새로 만들기 때문에 매번 덧붙임
          cp native/AltPayActivity.java app/src/main/java/kr/plusevapp/twa/
          grep -q billingclient app/build.gradle || sed -i "0,/dependencies {/s//dependencies {\n    implementation 'com.android.billingclient:billing:8.0.0'/" app/build.gradle
          python3 - <<'PY'
          p = 'app/src/main/AndroidManifest.xml'; s = open(p).read()
          a = '''<activity android:name=".AltPayActivity" android:exported="true" android:theme="@android:style/Theme.Translucent.NoTitleBar">
                  <intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="plusev" android:host="altpay"/></intent-filter>
              </activity>
          '''
          if 'AltPayActivity' not in s: s = s.replace('</application>', a + '</application>', 1)
          open(p, 'w').write(s)
          PY
          grep -n billingclient app/build.gradle && grep -c AltPayActivity app/src/main/AndroidManifest.xml
          bubblewrap build --skipPwaValidation
          ls -la *.aab *.apk

      - name: assetlinks.json 생성 (도메인 소유 증명)
        working-directory: android
        run: |
          # 업로드 키 + 구글 플레이 앱 서명 키(play_fingerprint.txt, 한 줄에 하나)
          FPS=$( (grep -o 'SHA256: .*' fingerprint.txt | cut -d' ' -f2; cat play_fingerprint.txt 2>/dev/null) | grep -E '^([0-9A-F]{2}:){31}[0-9A-F]{2}$' | sed 's/.*/"&"/' | paste -sd, )
          mkdir -p ../.well-known
          echo "[{\"relation\":[\"delegate_permission/common.handle_all_urls\"],\"target\":{\"namespace\":\"android_app\",\"package_name\":\"kr.plusevapp.twa\",\"sha256_cert_fingerprints\":[$FPS]}}]" > ../.well-known/assetlinks.json
          cat ../.well-known/assetlinks.json

      - name: assetlinks.json·암호화 키 저장소에 커밋
        run: |
          git config user.name "plus-ev-bot"; git config user.email "bot@plusevapp.kr"
          git add .well-known/assetlinks.json android/android.keystore.enc
          git diff --cached --quiet || (git commit -m "assetlinks.json + 암호화된 서명 키" && git push) || true

      - uses: actions/upload-artifact@v4
        with:
          name: plusev-android
          path: |
            android/app-release-bundle.aab
            android/app-release-signed.apk
            android/android.keystore
            android/android.keystore.enc
            android/fingerprint.txt
            .well-known/assetlinks.json
