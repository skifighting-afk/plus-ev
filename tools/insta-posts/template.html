<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<style>
/* +EV 인스타 게시물 (1080x1350) — 검정 실사 배경 + 민트 강조 + 앱 알림 카드 */
:root{--mint:#7CCB9B;--mint-btn:#6DBE8C;--ink:#0D1A12;--fg:#F4F6F5;--mut:#A7AEAB;--glass:rgba(22,24,26,.84);--line:rgba(255,255,255,.09);
 --sans:'Pretendard','Noto Sans KR',sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0b0c0d;font-family:var(--sans);color:var(--fg);word-break:keep-all}
#c{position:relative;width:1080px;height:1350px;overflow:hidden;background:#0b0c0d center/cover no-repeat}
#c::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,8,8,.80) 0%,rgba(6,8,8,.55) 30%,rgba(6,8,8,.42) 55%,rgba(6,8,8,.80) 100%)}
.in{position:absolute;inset:0;z-index:2;padding:76px 72px 70px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center}
.eb{font-family:var(--mono);font-size:29px;font-weight:500;letter-spacing:.2em;color:#86B99B}
.logo{font-size:44px;font-weight:900;font-style:italic;letter-spacing:-1px;color:#fff}.logo b{color:var(--mint)}
.hd{margin-top:58px}
.hd div{white-space:nowrap;font-size:96px;font-weight:800;line-height:1.16;letter-spacing:-3px}
.hd .h2{color:var(--mint)}
.swipe{position:absolute;left:72px;bottom:66px;font-size:34px;font-weight:600;color:#C9CECC;z-index:3}
.note{font-size:24px;color:rgba(255,255,255,.55);margin-top:18px}
.glass{background:var(--glass);border:1.5px solid var(--line);border-radius:30px;padding:34px 36px;backdrop-filter:blur(6px);box-shadow:0 30px 80px rgba(0,0,0,.45)}
.card{margin-top:auto;margin-bottom:150px}
.card .app{font-size:26px;color:var(--mut);display:flex;gap:10px;align-items:center}
.card .ttl{display:flex;align-items:center;gap:16px;font-size:46px;font-weight:800;margin-top:12px;letter-spacing:-1px}
.card .sub{font-size:31px;color:#C9CECC;margin-top:12px}
.btn{margin-top:28px;height:100px;border-radius:22px;background:var(--mint-btn);color:var(--ink);font-size:38px;font-weight:800;display:flex;align-items:center;justify-content:center}
.bell{width:46px;height:46px;flex:none}
.big{margin-top:auto;margin-bottom:150px}
.big .num{font-size:230px;font-weight:900;letter-spacing:-9px;line-height:1;color:#fff;white-space:nowrap}
.big .num small{font-size:80px;letter-spacing:-2px;color:var(--mint);margin-left:10px}
.big .sub{font-size:44px;font-weight:700;margin-top:22px}
.list{margin-top:auto;margin-bottom:150px;display:flex;flex-direction:column;gap:22px}
.row{display:flex;align-items:center;gap:26px;font-size:44px;font-weight:700;letter-spacing:-1px}
.ck{width:58px;height:58px;flex:none;border-radius:50%;background:var(--mint-btn);display:grid;place-items:center}
.ck svg{width:32px;height:32px}
.list.glass .row{padding:6px 0}
.steps{margin-top:auto;margin-bottom:150px;display:flex;flex-direction:column;gap:20px}
.st{display:flex;gap:28px;align-items:center}
.st .n{font-family:var(--mono);font-size:34px;font-weight:700;color:var(--ink);background:var(--mint-btn);width:78px;height:78px;border-radius:20px;display:grid;place-items:center;flex:none}
.st .t{font-size:46px;font-weight:800;letter-spacing:-1px}.st .d{font-size:30px;color:var(--mut);margin-top:4px}
.panel{margin-top:auto;margin-bottom:150px}
.panel .pt{font-size:32px;color:var(--mut);font-weight:600;margin-bottom:14px}
.panel .pr{display:flex;justify-content:space-between;align-items:baseline;padding:22px 0;border-top:1.5px solid var(--line);font-size:40px;font-weight:600}
.panel .pr b{font-size:48px;font-weight:800;color:#fff}.panel .pr:last-of-type b{color:var(--mint)}
.cta .checks{margin-top:auto;display:flex;flex-direction:column;gap:16px}
.cta .row{font-size:38px}
.cta .ck{width:48px;height:48px}.cta .ck svg{width:26px;height:26px}
.cta .btn{margin-top:40px;height:118px;font-size:44px;border-radius:60px}
.foot{position:absolute;left:72px;right:72px;bottom:56px;z-index:3;display:flex;justify-content:space-between;align-items:center;height:96px;padding:0 36px;border-radius:60px;background:var(--mint-btn);color:var(--ink);font-size:38px;font-weight:800}
.foot span{font-size:28px;font-weight:700;opacity:.75}
.cta .s2{text-align:center;font-size:30px;color:#C9CECC;margin-top:20px}
</style></head><body><div id="c"><div class="in" id="in"></div></div>
<script>
const CK='<svg viewBox="0 0 24 24" fill="none" stroke="#0D1A12" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const BELL='<svg class="bell" viewBox="0 0 24 24" fill="#7CCB9B"><path d="M12 2.5a1.5 1.5 0 0 1 1.5 1.5v.6a6.5 6.5 0 0 1 5 6.3v4.6l1.7 2.3a1 1 0 0 1-.8 1.6H4.6a1 1 0 0 1-.8-1.6l1.7-2.3v-4.6a6.5 6.5 0 0 1 5-6.3V4A1.5 1.5 0 0 1 12 2.5zM9.8 20.5h4.4a2.2 2.2 0 0 1-4.4 0z"/></svg>';
const e=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
function fit(el,max){let f=parseFloat(getComputedStyle(el).fontSize);while(el.scrollWidth>max&&f>40){f-=2;el.style.fontSize=f+'px'}}
function draw(post,s,i,bg){
  document.getElementById('c').style.backgroundImage=bg?`url(${bg})`:'radial-gradient(900px 700px at 70% 45%,#1d2a23,#0b0c0d 70%)';
  const n=post.s.length,eb=post.single?post.eb:`${post.eb} · ${i+1}/${n}`;
  const hd=(s.h1||s.h2)?`<div class="hd">${s.h1?`<div class="h1">${e(s.h1)}</div>`:''}${s.h2?`<div class="h2">${e(s.h2)}</div>`:''}</div>`:'';
  let body='';
  if(s.t==='hook'){const ap=s.card.app.includes('지금')?s.card.app:s.card.app+' · 지금';body=`<div class="glass card"><div class="app">${e(ap)}</div><div class="ttl">${BELL}<span>${e(s.card.title)}</span></div><div class="sub">${e(s.card.sub)}</div><div class="btn">${e(s.card.btn)}</div>${s.note?`<div class="note">${e(s.note)}</div>`:''}</div>`}
  if(s.t==='big')body=`<div class="big"><div class="num">${e(s.num)}${s.unit?`<small>${e(s.unit)}</small>`:''}</div><div class="sub">${e(s.sub)}</div>${s.note?`<div class="note">${e(s.note)}</div>`:''}</div>`;
  if(s.t==='list')body=`<div class="glass list">${s.items.map(x=>`<div class="row"><span class="ck">${CK}</span><span>${e(x)}</span></div>`).join('')}${s.note?`<div class="note">${e(s.note)}</div>`:''}</div>`;
  if(s.t==='steps')body=`<div class="steps">${s.steps.map((x,j)=>`<div class="glass st"><span class="n">0${j+1}</span><div><div class="t">${e(x[0])}</div><div class="d">${e(x[1])}</div></div></div>`).join('')}</div>`;
  if(s.t==='ui')body=`<div class="glass panel"><div class="pt">${e(s.panel.title)}</div>${s.panel.rows.map(r=>`<div class="pr"><span>${e(r[0])}</span><b>${e(r[1])}</b></div>`).join('')}${s.panel.btn?`<div class="btn">${e(s.panel.btn)}</div>`:''}${s.note?`<div class="note">${e(s.note)}</div>`:''}</div>`;
  if(s.t==='cta')body=`<div class="cta" style="display:flex;flex-direction:column;flex:1"><div class="checks glass">${s.checks.map(x=>`<div class="row"><span class="ck">${CK}</span><span>${e(x)}</span></div>`).join('')}</div><div class="btn">plusev.co.kr →</div><div class="s2">사장님 한 달 무료 · 딜러 가입 무료</div></div>`;
  document.getElementById('in').innerHTML=`<div class="top"><span class="eb">${e(eb)}</span><span class="logo"><b>+</b>EV</span></div>${hd}${body}${post.single?(s.t==='cta'?'':'<div class="foot">plusev.co.kr →<span>사장님 한 달 무료</span></div>'):(i<n-1?'<div class="swipe">밀어서 보기 →</div>':'')}`;
  document.querySelectorAll('.hd div').forEach(d=>fit(d,936));
  document.querySelectorAll('.big .num').forEach(d=>fit(d,936));
  document.querySelectorAll('.row span:last-child,.card .ttl span,.card .sub').forEach(d=>{d.style.whiteSpace='nowrap';fit(d,d.parentElement.clientWidth-(d.previousElementSibling?d.previousElementSibling.offsetWidth+30:0))});
  return document.fonts.ready.then(()=>true);
}
</script></body></html>
