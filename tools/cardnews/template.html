<!doctype html><html><head><meta charset="utf-8">
<!-- +EV 카드뉴스 템플릿 (1080x1350). slides_data.js 의 W 배열을 고치면 문구가 바뀜. 배경 이미지는 같은 폴더에 bg0.png… (backgrounds.md 참고) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800;900&family=Gothic+A1:wght@400;600;700;800;900&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Noto Sans KR';color:#fff;background:#000}
.c{width:1080px;height:1350px;position:relative;overflow:hidden;background:#111 center/cover no-repeat}
.c::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 20%,rgba(0,0,0,.1) 36%,rgba(0,0,0,.82) 62%,rgba(0,0,0,.94) 100%)}
.in{position:absolute;inset:0;z-index:2;padding:70px 72px 90px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center}
.pill{background:rgba(0,0,0,.45);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25);border-radius:40px;padding:10px 24px;font-size:28px;font-weight:600}
.pg{font-size:28px;font-weight:600;opacity:.85}
.hd{margin-top:auto;font-size:60px;line-height:1.2;font-weight:800;letter-spacing:-1.5px;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.num{white-space:nowrap;font-size:230px;font-weight:900;color:#FFD24A;line-height:1;letter-spacing:-8px;margin:4px 0 0 -6px;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.tl{margin-top:18px;font-size:46px;font-weight:700;letter-spacing:-1px;color:#fff}
.ac{font-size:22px;color:rgba(255,255,255,.65);margin-top:16px}
.rows{margin-top:24px}.rows div{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0;border-bottom:2px solid rgba(255,255,255,.2);font-size:50px;font-weight:700}.rows b{font-size:96px;font-weight:900;color:#FFD24A;letter-spacing:-4px}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:18px}.tot span{font-size:56px;font-weight:800}.tot b{font-size:170px;font-weight:900;color:#FF4D4D;letter-spacing:-8px;line-height:1}
.dots{position:absolute;z-index:3;bottom:40px;left:0;right:0;display:flex;justify-content:center;gap:12px}.dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.45)}.dots i.on{background:#fff}
.cta{margin-top:36px;display:inline-flex;align-self:flex-start;align-items:center;background:#fff;color:#111;border-radius:60px;padding:22px 40px;font-size:36px;font-weight:800}
.pos{background-size:135% auto!important;background-position:100% 30%!important}
.end .num{color:#fff}.end .num .ev{color:#FFD24A}.ev sup{color:#8FE3C4;font-size:.5em;vertical-align:.55em;margin-right:6px}
/* 4장 폰 안의 +EV 앱 화면 (실제 앱 색·글꼴 재현) */
.ph{position:absolute;z-index:3;right:70px;top:110px;width:470px;height:740px;border-radius:64px;background:#000;padding:14px;box-shadow:0 40px 80px rgba(0,0,0,.6),0 0 0 3px #333;font-family:'Gothic A1','Noto Sans KR'}
.sc{width:100%;height:100%;border-radius:52px;background:#111417;color:#ECEFF1;padding:26px 24px;overflow:hidden;position:relative}
.bar{display:flex;justify-content:space-between;font-size:18px;opacity:.9}.bar b{font-size:24px}
.ti{font-size:34px;font-weight:800;margin:16px 0 12px}
.seg{display:flex;background:#171B1F;border:1px solid rgba(236,239,241,.06);border-radius:999px;padding:5px;font-size:17px;font-weight:600}.seg span{flex:1;text-align:center;padding:10px 0;border-radius:999px;color:#9aa3ab}.seg .on{background:#22282D;color:#ECEFF1}
.nt{font-size:13.5px;color:#9aa3ab;margin:10px 0 6px}
.sc label{display:block;font-size:15px;font-weight:700;margin:12px 0 6px;color:#cfd5d9}
.ip{background:#0E1422;border:1px solid rgba(236,239,241,.11);border-radius:12px;padding:13px 14px;font-size:19px;font-weight:700}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mn{color:#8FE3C4;font-size:14px;font-weight:700;margin-top:6px}
.go{position:absolute;left:24px;right:24px;bottom:28px;background:#E9C27A;color:#2a1e05;border-radius:999px;text-align:center;padding:18px;font-size:21px;font-weight:800}
.toast{position:absolute;left:-90px;right:40px;top:560px;background:#8FE3C4;color:#0B2A20;border-radius:20px;padding:18px 22px;font-size:24px;font-weight:800;box-shadow:0 14px 30px rgba(0,0,0,.4)}
.mo{font-size:19px;margin:16px 0 10px;color:#cfd5d9}.mo b{color:#ECEFF1;margin:0 8px}
.li{display:flex;justify-content:space-between;align-items:center;background:#171B1F;border:1px solid rgba(236,239,241,.06);border-radius:14px;padding:13px 14px;margin-top:8px}
.li b{display:block;font-size:19px}.li small{font-size:13.5px;color:#9aa3ab}.li em{font-style:normal;font-weight:800;font-size:19px;color:#8FE3C4}
.li em.call{background:#22282D;color:#ECEFF1;border-radius:999px;padding:6px 14px;font-size:15px}
.chips{display:flex;gap:8px;margin-top:14px}.chips span{background:#22282D;border:1px solid rgba(236,239,241,.1);border-radius:10px;padding:9px 12px;font-size:14px;font-weight:700}
.tb{background:#171B1F;border:1px solid rgba(236,239,241,.06);border-radius:16px;padding:14px;margin-top:6px}
.tr{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;padding:12px 0;border-bottom:1px solid rgba(236,239,241,.07);font-size:17px;text-align:right}
.tr>*:first-child{text-align:left}.tr.th{font-size:14px;color:#9aa3ab}.tr b{font-weight:800}.tr i{font-style:normal;font-weight:800;color:#8FE3C4}
</style></head><body><script src="slides_data.js"></script></body></html>
