<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
/* +EV 홀덤 스터디 릴스 1080x1920 — 검정 펠트 + 민트 강조. 인스타 UI 피해서 내용은 y 230~1500 */
:root{--mint:#4CC78A;--mint2:#7CCB9B;--ink:#06140C;--fg:#F3F6F4;--mut:#A3ACA7;--glass:rgba(20,24,22,.86);--line:rgba(255,255,255,.09);
 --sans:'Pretendard','Noto Sans KR',sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#060807;font-family:var(--sans);color:var(--fg);word-break:keep-all}
#bg{position:absolute;inset:0;background:radial-gradient(1100px 900px at 50% 42%,#123321 0%,#0a1a12 45%,#050706 80%)}
#bg::after{content:'';position:absolute;inset:0;opacity:.18;background-image:radial-gradient(rgba(255,255,255,.18) 1px,transparent 1px);background-size:6px 6px}
#top{position:absolute;top:150px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center;z-index:3}
#top .k{font-family:var(--mono);font-size:30px;letter-spacing:.16em;color:var(--mint2)}
#top .tg{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:.12em;color:var(--ink);background:var(--mint);padding:10px 20px;border-radius:12px}
#st{position:absolute;left:80px;right:80px;top:260px;bottom:420px;z-index:2;display:flex;flex-direction:column;justify-content:center}
#sub{position:absolute;left:70px;right:70px;bottom:300px;z-index:3;text-align:center;font-size:40px;font-weight:700;line-height:1.4;color:#fff;text-shadow:0 2px 12px #000}
#sub span{background:rgba(0,0,0,.55);padding:8px 16px;border-radius:12px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hl{color:var(--mint)}
.big{font-size:132px;font-weight:900;line-height:1.12;letter-spacing:-5px}
.big .l2{color:var(--mint)}
.hsub{margin-top:40px;font-size:42px;font-weight:600;color:var(--mut)}
.ttl{font-family:var(--mono);font-size:32px;letter-spacing:.12em;color:var(--mint2);margin-bottom:34px}
.ln{font-size:66px;font-weight:800;line-height:1.3;letter-spacing:-2px;margin:14px 0}
.ln.s{font-size:54px}
.glass{background:var(--glass);border:1.5px solid var(--line);border-radius:30px;padding:44px}
.cards{display:flex;gap:18px;justify-content:center}
.cd{width:150px;height:212px;border-radius:16px;background:#F7F7F2;color:#111;position:relative;box-shadow:0 14px 30px rgba(0,0,0,.5);font-family:'Noto Sans KR',sans-serif}
.cd .r{position:absolute;top:10px;left:16px;font-size:58px;font-weight:900;line-height:1}
.cd .s{position:absolute;bottom:14px;right:16px;font-size:72px;line-height:1}
.cd.red{color:#D3263A}
.cd.back{background:repeating-linear-gradient(45deg,#1d6b47 0 12px,#17583a 12px 24px);border:6px solid #F7F7F2}
.felt{position:relative;margin:0 -20px;padding:70px 40px 60px;border-radius:300px/190px;background:radial-gradient(ellipse at 50% 40%,#1f6b45,#0f3d27 70%);border:14px solid #2a1c12;box-shadow:inset 0 0 60px rgba(0,0,0,.5),0 30px 80px rgba(0,0,0,.5)}
.street{text-align:center;font-family:var(--mono);font-size:30px;letter-spacing:.24em;color:rgba(255,255,255,.75);margin-bottom:26px}
.pot{display:flex;justify-content:center;gap:26px;margin-top:30px}
.chip{font-family:var(--mono);font-size:32px;font-weight:700;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.15);border-radius:999px;padding:10px 24px}
.chip b{color:var(--mint)}
.hero{margin-top:60px}
.hero .lb{text-align:center;font-family:var(--mono);font-size:28px;letter-spacing:.2em;color:var(--mut);margin-bottom:18px}
.pill{display:block;margin:44px auto 0;width:max-content;max-width:100%;font-size:38px;font-weight:700;padding:16px 30px;border-radius:999px;background:rgba(76,199,138,.16);color:var(--mint2);border:1.5px solid rgba(76,199,138,.4)}
.bar{margin:26px 0}
.bar .lb{display:flex;justify-content:space-between;font-size:44px;font-weight:800;margin-bottom:12px}
.bar .lb b{font-family:var(--mono);color:var(--mint)}
.bar .tr{height:46px;border-radius:12px;background:rgba(255,255,255,.08);overflow:hidden}
.bar .fl{height:100%;border-radius:12px;background:linear-gradient(90deg,#2f9c68,var(--mint))}
.bar.dim .fl{background:linear-gradient(90deg,#5b6a62,#8a9a91)}.bar.dim .lb b{color:#cfd6d2}
.cmb{display:flex;justify-content:space-between;align-items:baseline;padding:30px 0;border-top:1.5px solid var(--line);font-size:70px;font-weight:900}
.cmb:first-of-type{border-top:0}.cmb b{font-family:var(--mono);color:var(--mint)}
.q{font-size:64px;font-weight:900;line-height:1.25;letter-spacing:-2px}
.opt{display:flex;align-items:center;gap:28px;margin-top:26px;font-size:54px;font-weight:800;padding:26px 34px;border-radius:24px;background:var(--glass);border:1.5px solid var(--line)}
.opt i{font-style:normal;font-family:var(--mono);width:74px;height:74px;border-radius:18px;background:var(--mint);color:var(--ink);display:grid;place-items:center;font-size:38px}
.cmt{margin-top:44px;text-align:center;font-size:44px;font-weight:800;color:var(--mint)}
.end{align-items:center;text-align:center}
.end .logo{font-size:190px;font-weight:900;font-style:italic;letter-spacing:-6px}.end .logo b{color:var(--mint)}
.end .t1{font-size:58px;font-weight:900;margin-top:20px}
.end .t2{font-size:40px;color:var(--mut);margin-top:22px}
.end .url{margin-top:60px;font-family:var(--mono);font-size:44px;letter-spacing:.12em;color:var(--ink);background:var(--mint);padding:22px 48px;border-radius:999px}
</style></head><body><div id="bg"></div>
<div id="top"><span class="k" id="k"></span><span class="tg" id="tg"></span></div>
<div id="st"></div><div id="sub"></div>
<script>
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),eo=x=>1-Math.pow(1-clamp(x),3),seg=(t,a,d)=>clamp((t-a)/d);
const IN=(t,a,d=.4,dy=50)=>`opacity:${eo(seg(t,a,d))};transform:translateY(${(1-eo(seg(t,a,d)))*dy}px)`;
const e=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
const H=s=>e(s).replace(/\[(.+?)\]/g,'<span class="hl">$1</span>');
const SU={s:'♠',h:'♥',d:'♦',c:'♣'};
const card=(c,t,a)=>{if(c==='??')return `<div class="cd back" style="${IN(t,a,.3,40)}"></div>`;const r=c[0]==='T'?'10':c[0],s=c[1];return `<div class="cd ${'hd'.includes(s)?'red':''}" style="${IN(t,a,.3,40)}"><span class="r">${r}</span><span class="s">${SU[s]}&#xFE0E;</span></div>`};
const R={
 hook:(s,t)=>`<div class="big">${s.big.map((l,i)=>`<div class="${i?'l2':''}" style="${IN(t,.05+i*.22)}">${e(l)}</div>`).join('')}</div><div class="hsub" style="${IN(t,.55)}">${e(s.sub)}</div>`,
 table:(s,t)=>{const b=(s.board||'').split(' ').filter(Boolean),h=(s.hero||'').split(' ').filter(Boolean);
   return `<div class="felt" style="${IN(t,0,.35,30)}"><div class="street">${e(s.street)}</div><div class="cards">${b.length?b.map((c,i)=>card(c,t,.15+i*.08)).join(''):['??','??'].map((c,i)=>card(c,t,.15+i*.08)).join('')}</div>${(s.pot||s.bet)?`<div class="pot" style="${IN(t,.5)}">${s.pot?`<span class="chip">POT <b>${e(s.pot)}</b></span>`:''}${s.bet?`<span class="chip">BET <b>${e(s.bet)}</b></span>`:''}</div>`:''}</div>`+
   (h.length?`<div class="hero"><div class="lb" style="${IN(t,.45)}">MY HAND</div><div class="cards">${h.map((c,i)=>card(c,t,.55+i*.1)).join('')}</div></div>`:'')+(s.label?`<span class="pill" style="${IN(t,.7)}">${e(s.label)}</span>`:'')},
 math:(s,t)=>`<div class="ttl" style="${IN(t,0)}">${e(s.title)}</div><div class="glass">${s.lines.map((l,i)=>`<div class="ln ${l.length>18?'s':''}" style="${IN(t,.15+i*.25)}">${H(l)}</div>`).join('')}</div>`,
 rule:(s,t)=>`<div class="ttl" style="${IN(t,0)}">${e(s.title)}</div><div class="glass">${s.lines.map((l,i)=>`<div class="ln ${l.length>16?'s':''}" style="${IN(t,.15+i*.25)}">${H(l)}</div>`).join('')}</div>`,
 bars:(s,t)=>{const mx=Math.max(...s.items.map(x=>x[1]))*1.08;return `<div class="ttl" style="${IN(t,0)}">${e(s.title)}</div><div class="glass">${s.items.map((x,i)=>`<div class="bar ${i%2&&s.items.length===2?'dim':''}" style="${IN(t,.1+i*.15)}"><div class="lb"><span>${e(x[0])}</span><b>${x[1]}${e(s.unit||'')}</b></div><div class="tr"><div class="fl" style="width:${eo(seg(t,.3+i*.15,.6))*x[1]/mx*100}%"></div></div></div>`).join('')}</div>`},
 combo:(s,t)=>`<div class="ttl" style="${IN(t,0)}">${e(s.title)}</div><div class="glass">${s.rows.map((r,i)=>`<div class="cmb" style="${IN(t,.15+i*.25)}"><span>${e(r[0])}</span><b>${e(r[1])}</b></div>`).join('')}</div>`,
 quiz:(s,t)=>`<div class="ttl" style="${IN(t,0)}">QUIZ</div><div class="q" style="${IN(t,.1)}">${e(s.q)}</div>${s.opts.map((o,i)=>`<div class="opt" style="${IN(t,.35+i*.15)}"><i>${'ABC'[i]}</i>${e(o)}</div>`).join('')}<div class="cmt" style="${IN(t,.8)}">정답은 댓글로 ↓</div>`,
 end:(s,t)=>`<div class="end" style="display:flex;flex-direction:column"><div class="logo" style="${IN(t,0,.4,30)}"><b>+</b>EV</div><div class="t1" style="${IN(t,.25)}">이기는 펍의 선택</div><div class="t2" style="${IN(t,.4)}">${e(s.sub||'홀덤펍 운영 · 딜러 구인 · 급여 관리')}</div><div class="url" style="${IN(t,.55)}">plusev.co.kr</div></div>`
};
let L;
function setup(lesson){L=lesson;document.getElementById('k').textContent=`HOLD'EM STUDY · 심화 #${lesson.id.slice(1)}`;document.getElementById('tg').textContent=lesson.tag;return document.fonts.ready.then(()=>1)}
function draw(i,t){const s=L.scenes[i];document.getElementById('st').innerHTML=R[s.t](s,t);
  document.getElementById('sub').innerHTML='';
  document.getElementById('top').style.opacity=s.t==='end'?0:1}
</script></body></html>
